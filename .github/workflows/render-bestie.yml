name: Render Bestie Cup MP4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bestie-cup-video/public/logo.png'
      - 'bestie-cup-video/src/**'
      - 'bestie-cup-video/scripts/**'
      - 'bestie-cup-video/package.json'
      - '.github/workflows/render-bestie.yml'

permissions:
  contents: write

concurrency:
  group: bestie-cup-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bestie-cup-video
    steps:
      - uses: actions/checkout@v4
      - name: Check logo
        run: |
          if [ ! -f public/logo.png ]; then
            echo "::error::Add the original logo at bestie-cup-video/public/logo.png first."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Japanese fonts and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk python3-pil ffmpeg
      - name: Install dependencies and check types
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Prepare logo
        run: /usr/bin/python3 scripts/prepare-logo.py
      - name: Render MP4
        run: npm run render -- --props=render-props.json --concurrency=2 --crf=18
      - name: Verify MP4
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json out/bestie-cup.mp4
          test -s out/bestie-cup.mp4
          test "$(stat -c%s out/bestie-cup.mp4)" -lt 95000000
      - uses: actions/upload-artifact@v4
        with:
          name: bestie-cup-mp4
          path: bestie-cup-video/out/bestie-cup.mp4
          retention-days: 30
          if-no-files-found: error
      - name: Save MP4 in repository
        run: |
          mkdir -p exports
          cp out/bestie-cup.mp4 exports/bestie-cup.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/bestie-cup.mp4
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Export Bestie Cup MP4"
          git pull --rebase origin main
          git push origin HEAD:main
